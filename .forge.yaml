# .forge.yaml — claude-forge mange sa propre config (dogfooding).
# Le repo héberge le subject méta `subjects/claude-forge/` à sa racine.

# Index/metrics à la racine du repo
output_dir: .

# Subjects à la racine (subjects/)
pool_roots: ["."]

# Pool plat : pas de groupage de domaine
domain_roots: []

# Visibilité des SKILL.md générés ici
skill_visibility: claude-forge
