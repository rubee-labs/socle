# Décision — Forge optimise l'efficacité, pas un moat

## Contexte

Pendant 8 analyses Forge-Lab, l'évaluation des signaux a été polluée par une question parasite : « est-ce que ça renforce / fragilise le moat de Forge ? ». Benjamin tranche le 2026-06-15 : **Forge n'a pas de moat à défendre.** L'unique objectif est d'être le système de mémoire le plus efficace pour utiliser Claude Code en entreprise.

## Décision

### 1. Critère unique d'évaluation

Toute primitive, tout pilier, tout signal externe se juge désormais sur **une seule question** : *« est-ce que ça rend Claude Code plus efficace en entreprise ? »*. La notion de défensibilité / moat est abandonnée comme critère (dimension de scoring `defensibilite` dépréciée dans les analyses Forge-Lab).

### 2. Ce qui gagne sa place (efficacité prouvée, conservé sans débat)

- **Memory-at-the-edge** — subjects co-localisés avec le code. Claude trouve sans chercher.
- **`/documente`** — orchestrateur unique, friction minimale.
- **MEMORY.md compact (Quick + Détails)** — cascade mesurée à 100% (bench 2026-05-24).
- **Conformance OKF v0.1** — interop + outillage tiers gratuit (D7/D8/D9 du jour).
- **Producer typing (4 sous-dossiers)** — audit « qui a décidé quoi », vrai besoin entreprise (compliance).

### 3. Features mises en sursis 30 jours (review 2026-07-15)

Ces 3 features étaient conservées par habitude / au nom du moat. Sous le critère d'efficacité, elles n'ont pas fait leurs preuves. Sursis, pas suppression brutale :

| Feature | Constat 2026-06-15 | Critère de survie à 30j | Sinon |
|---|---|---|---|
| **Cycle de vie γ** (3 états) | 27 alertes de stagnation, fatigue d'alerte. Savoir « actif vs mature » ne change quasi aucune décision de Claude. | Au moins une transition `actif→mature` influence une décision réelle (humaine ou Claude) observable. | Réduire à un simple `archived: yes/no`, supprimer les états intermédiaires + les alertes de stagnation du scanner. |
| **`/skillify`** | 0 skill produit depuis sa création (2026-05-10). | ≥ 1 skill réellement produit et utilisé. | Marquer abandonné (comme `/compile-doctrine` avant lui). |
| **`/cross-modal-review`** | Adoption nulle présumée. | ≥ 1 invocation réelle sur un subject. | Marquer abandonné. |

Neutres, conservés sans débat (coût faible) : autolink typed, nomenclature bilingue.

## Pourquoi ce n'est pas une suppression immédiate

Le principe Forge « trigger humain explicite > auto-trigger » + « pas d'action sans cas concret observé » (leçon 2026-05-21) s'applique aussi à la suppression : on ne retire pas une feature sur une intuition, on la met sous observation mesurable et on tranche sur les données à 30 jours.

## Suite

- Review 2026-07-15 : trancher les 3 features sur les données réelles.
- Aucune action d'ici là sauf si un cas d'usage concret réhabilite spontanément une des 3.
