# Refonte cycle γ — 8 états → 3 états

## Contexte

Lors de la livraison Vague 2 (P3 skillify + P2 cross-modal-eval), Benjamin a relevé que `/skillify` recouvre exactement la branche « procédurale → skill auto-généré » du `/compile-doctrine` théorique de la doctrine Forge. C'est un doublon partiel.

Plus profondément : l'analyse FORGE-analyse 2026-05-09 (proposition 1) avait déjà identifié le **YAGNI du cycle γ à 8 états + conviction numérique** comme une fragilité. 0 doctrine compilée à ce jour, 0 transition `tentative → stress_testing → doctrine → in_service` observée, conviction `+10/-15` arbitraire — autant de mécaniques qui n'ont jamais produit de signal opérationnel.

Décision : aller au bout de la logique. Si `/compile-doctrine` est abandonné parce que la compilation continue à l'usage (skillify) marche mieux, alors le cycle γ qui le portait perd son sens, et il faut le simplifier.

## Décision (refonte complète)

### 1. Cycle simplifié à 3 états

```
actif ──► mature ──► archived
   ▲        │
   └────────┘ (retour si contre-signal)
```

Mapping rétrocompatible :
- `seed`, `debating`, `tentative` → **`actif`**
- `stress_testing`, `doctrine`, `in_service`, `under_review` → **`mature`**
- `archived` → **`archived`** (inchangé)

### 2. Transitions 100% manuelles

Le moteur (`forge_engine.py`) ne mute jamais `forging_state` automatiquement. Toutes les transitions passent par `/documente` avec validation explicite Benjamin. Suppression de `detect_transition` opérationnelle (la fonction retourne désormais toujours `None`).

### 3. Conviction numérique abandonnée

Champ `conviction` (0..100) déprécié. Ignoré par le moteur. Conservé en lecture seule pour ne pas casser l'existant. Mêmes mécaniques pour `stress_tests_passed` et `compiled_artifacts`.

### 4. /compile-doctrine abandonné

Skill théorique jamais utilisé en pratique. Sa branche « procédurale → skill » est portée par `/skillify` (compilation continue à l'usage). Les autres patterns historiques (déclarative → règle, comportementale → agent SDK, évitement → injection, métrique → monitor, routing → FK) seront instruits au cas par cas si le besoin émerge concrètement — pas d'API générique pré-construite.

### 5. /stress-test découplé du cycle

Reste un outil **optionnel à la demande**. Confronte un subject sous 3 perspectives (contradicteur, steelman, yagni). **Pas de mutation de `forging_state`** ni de `conviction`. Sortie : analyse adversariale dans `<subject>/analyses/<date>-stress-test.md`.

### 6. Alertes scanner adaptées

Suppression : `doctrine_uncompiled`, `stress_test_missing` (obsolètes). Conservation : `stagnation` (subject `actif` >30j sans event), `merger_candidate` (overlap linked_subjects).

## Validation

- `forge_engine` sur subject réel : mapping `tentative → actif` correct, `transition_proposal: null`, warning informatif ✓
- `forge_scanner --status` : `0 alerte(s) — 26 actifs (25 actif + 1 mature), 0 stagnants` ✓
- 32 tests unittest passent (autolink + skillify + eval) ✓
- 5 REFERENCE.md des types annotés avec note de refonte (préserve les notes métier importantes, notamment la note sur `supplier-order` qui pointait déjà l'inadéquation du cycle γ standard)

## Conséquences sur les vagues précédentes

- **Vague 1 (P5 autolink)** : inchangée. Le typed graph fonctionne indépendamment du cycle de vie.
- **Vague 2 (P3 skillify)** : porte maintenant officiellement la branche « procédurale → skill » de la compilation. Plus de doublon avec `/compile-doctrine`.
- **Vague 2 (P2 cross-modal-review)** : invocable indépendamment. Le score d'eval n'entre dans aucune transition automatique (cohérent avec la suppression des transitions auto).

## Suite

- Mise à jour du HTML d'intégration pour refléter la nouvelle architecture
- Vague 3 P4 (métrique retrieval) à instruire quand Benjamin sera prêt
- Nettoyage progressif des MEMORY.md des subjects existants vers les nouveaux états (pas urgent — le mapping legacy garantit la rétrocompatibilité)
