---
date: 2026-05-04
type: decision
produced_by: human
decided_by: benjamin
status: active

upstream_discussions:
  - 2026-05-04-refonte-moteur-forge

revises:
  # Cette décision révise (sans annuler complètement) deux décisions antérieures
  # qui mentionnaient /forge comme skill autonome.
  - id: "2026-04-29-phase-0-livree"
    raison: "La liste 6 skills incluait /forge ; ramenée à 5 skills (sans /forge)."
  - id: "2026-04-29-control-tower-skill-manuel"
    raison: "Le workflow /control-tower invoquait /forge ; invoque désormais /documente."

decision:
  # Refonte du moteur subject pool (post-PR Ultraplan 6e189bc4)

  forge_skill: removed
  # Le skill /forge SKILL.md est supprimé du repo. Le mot "forge" reste utilisé
  # pour le moteur Python sous-jacent (forge_engine.py, forge_lib.py,
  # forge_scanner.py) mais sort du vocabulaire utilisateur.

  documente_version: "2.0"
  # /documente 1.0 → 2.0 : refonte complète (262 → 472 lignes), Phases 1-9 pour
  # subject pool + workflow legacy préservé pour les contextes hors subject pool.

  entry_point_unique: /documente
  # Un seul verbe utilisateur pour la forge. Capture conversation (si applicable)
  # + re-synthèse verticale (Quick + Détails) + cascade horizontale + transitions
  # γ auto + diff + commit + push.

  cascade_depth: 1
  # 1 niveau strict, pas de récursion. Rapidité prioritaire (appel fréquent).
  # Pour chaque linked_subject résolu :
  #   - last_event MAJ avec ref vers event déclencheur
  #   - Quick régénéré (stats agrégées + résumé activité)
  #   - Détails NON modifié (réservé à invocation directe)

  auto_transitions:
    - seed→debating          # ≥1 event ou ≥1 discussion ouverte
    - debating→tentative     # ≥1 active_decision (+ bump conviction à 50 si <50)
  # Chaînage possible dans une même invocation (max 2 itérations) si conditions
  # remplies sur l'état post-1ère transition.

  manual_transitions:
    - tentative→stress_testing   # via /stress-test
    - stress_testing→doctrine    # via /stress-test (verdict survived)
    - doctrine→in_service        # via /compile-doctrine
    - in_service→under_review    # signal humain ou contre-signal manuel
    - "*→archived"               # clôture manuelle

  affichage: transparent
  # Le diff (frontmatter + Quick) est affiché à Benjamin sans prompt.
  # Validation déjà obtenue en amont (par /control-tower ou par invocation manuelle).

  resolution_linked_subjects: heuristique_tolerante
  # Format frontmatter hétérogène autorisé (slug exact, <type>:<name>, etc.).
  # Cascade des heuristiques :
  #   1. <subject>/<link>/MEMORY.md (même parent que subject racine)
  #   2. <type>:<name> → <type>-<name>/MEMORY.md
  #   3. <type>:<name> → <name>/MEMORY.md (vérif type frontmatter)
  #   4. recherche globale par name dans tous les MEMORY.md de subjects
  #   5. non résolu → warning, pas d'erreur

architecture:
  couche_1: entreprise/config/feedback-loop/forge_engine.py
  couche_1_role: |
    Python déterministe. Lit MEMORY.md + sous-dossiers, calcule stats agrégées,
    recalcule last_event, détecte conditions transition γ, résout linked_subjects.
    NE TOUCHE PAS aux fichiers — retourne JSON sur stdout. <500ms.

  couche_2: entreprise/skills/documente/SKILL.md
  couche_2_role: |
    Claude. Invoque la couche 1 via Bash, parse le JSON, régénère narrative
    (Quick + Détails), applique transitions γ auto, fait la cascade horizontale
    (régénère Quick des linked_subjects mais pas leur Détails), affiche diff,
    commit, push.

  helpers: entreprise/config/feedback-loop/forge_lib.py
  helpers_role: |
    Helpers communs (parse_frontmatter, parse_simple_yaml, parse_value, days_since)
    extraits de forge_scanner.py. Importés par forge_engine.py et forge_scanner.py.

  scanner: entreprise/config/feedback-loop/forge_scanner.py
  scanner_role: |
    Inchangé dans son rôle. Tourne en SessionStart via init-healthcheck.sh.
    Régénère SUBJECTS-INDEX.md et SUBJECT-POOL-METRICS.md, émet alertes
    (stagnation, doctrine non compilée, stress test manquant, merger candidate).
    Refactor : utilise forge_lib.py au lieu de définir ses propres helpers.

skills_subject_pool_actuels:
  # Liste à jour des skills user-facing (5 au lieu de 6)
  - /subject-create-type      # création de TYPE (REFERENCE.md + TEMPLATE.md)
  - /subject-create           # instanciation d'un subject à partir d'un type
  - /documente                # entry point unique du moteur forge (ex-/forge)
  - /stress-test              # confrontation multi-perspective (3 angles)
  - /subject-merge            # soudure de 2 subjects (validation humaine)
  - /compile-doctrine         # production d'artefact exécutable (>= 80 conviction)

validation_end_to_end:
