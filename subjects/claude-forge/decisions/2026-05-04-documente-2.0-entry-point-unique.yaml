  date_test: 2026-05-04
  resultats:
    - "forge_engine.py : JSON valide, transition seed→debating détectée auto"
    - "cascade vers supplier-weifang résolue (heuristique supplier:weifang → supplier-weifang/)"
    - "stats agrégées calculées (total_orders: 1, total_amount_usd: 16943.0)"
    - "/documente : chaînage seed→debating→tentative en 1 invocation, conviction 0→50"
    - "## Quick régénéré reflète négo Fancy/Weifang v3 conclue (vs figé seed)"
    - "## Détails régénéré préserve sections custom (Stress tests, Notes libres)"
    - "cascade : supplier-weifang.last_event MAJ vers cascaded_from_order-398, Quick enrichi, Détails non touché"
    - "transition tentative→stress_testing proposée mais auto: false (hint affiché, pas appliquée — garde-fou)"
    - "forge_scanner.py : pas de régression (Forge: OK — 13 actifs)"
  commits:
    - "dbd927e8 docs: re-synthèse order-398 + cascade supplier-weifang"
    - "e00dd4ca auto: regen SUBJECTS-INDEX + SUBJECT-POOL-METRICS"

