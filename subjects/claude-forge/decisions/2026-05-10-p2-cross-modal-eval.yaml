# P2 — Cross-modal eval

## Contexte

L'analyse `/FORGE-analyse` du 9 mai sur le manifeste « Meta-Meta-Prompting » de Garry Tan a identifié **cross-modal eval** comme la primitive structurelle qui transforme la qualité de re-synthèse d'un signal opaque en signal mesurable. Le pattern Garry : chaque output significatif passé par 2-3 modèles distincts qui se notent mutuellement (Opus catch precision, GPT-5.5 catch missing context, DeepSeek catch generic-feel).

Forge avait `conviction` (0..100) numérique mais aucune mesure de qualité de re-synthèse. C'est le **faux confort principal** identifié dans l'analyse : la primitive `/documente` produit du contenu opaque sans qu'on sache s'il est bon. Cross-modal eval est le garde-fou qui transforme ce faux confort en signal mesurable et actionnable.

## Décision

Implémentation Vague 2 (P2) en 3 sous-commandes CLI + 1 skill markdown :

### Engine Python (`bin/eval_engine.py`)

1. **`forge eval prepare <subject-path>`** — lit MEMORY.md + scanne sources (events/, discussions/, decisions/, analyses/), compose un prompt structuré (4 axes) + résumé sources, retourne JSON.
2. **`forge eval aggregate --results <f1> <f2> ...`** — agrège N résultats JSON en score consolidé. Mean/min/max par axe, issues/suggestions dédupliquées entre évaluateurs. Tolérant aux JSON invalides (skip + alerte si <2 évaluateurs valides).
3. **`forge eval write-analysis <subject-path> --score <json>`** — persiste l'analyse dans `<subject>/analyses/<date>-cross-modal-eval.md` avec frontmatter conforme (`type: analysis`, `produced_by: claude`, `invoked_skill: /cross-modal-review`, `evaluator_count`, `overall_score`, `scoring`).

### Skill markdown (`skills/cross-modal-review/SKILL.md`)

Orchestrateur LLM 6 phases : prepare (Python) → spawn 3 sub-tasks Task tool (Opus + Sonnet + Haiku) → aggregate (Python) → write-analysis (Python) → présenter à Benjamin → commit (différé avec subject parent).

### Doctrine d'invocation

Pas d'`import anthropic` ni de clé API directe dans le module Python (cf. memory `feedback_jamais_cle_api_toujours_max_via_sdk.md`). Le skill markdown invoque les modèles via Task tool (le harness Claude Code dispatche les sub-agents avec plan Max). Si un dispatcher différent est nécessaire à l'avenir, passer par `claude-agent-sdk` avec auth Claude Code, jamais une clé API.

### 4 axes d'évaluation

- **coherence** : Quick ↔ Détails ↔ events/decisions cohérents ?
- **completeness** : décisions actives + events 30j + discussions ouvertes couverts ?
- **specificity** : faits Rubee concrets (noms, dates, IDs MCP) vs phrases génériques (« risques sous contrôle ») ?
- **citations** : chaque assertion forte renvoie-t-elle à un fichier identifiable ?

### Adaptations vs Garry

- **Single-provider** : Opus 4.7 + Sonnet 4.6 + Haiku 4.5 (pas Opus + GPT-5.5 + DeepSeek). Cohérent avec doctrine A Rubee (Anthropic minimaliste).
- **Pas de LLM dans l'engine Python** : invocation via skill markdown + Task tool. Permet à `bin/eval_engine.py` de rester stdlib only.
- **Tolérance aux pannes** : un évaluateur sur 3 peut renvoyer JSON invalide → l'agrégation tourne avec les 2 restants (alerte Benjamin si < 2).
- **Pas d'auto-déclenchement** dans /documente : coût LLM × 3 par eval, à réserver aux moments structurants (transition γ majeure, audit mensuel).

## Validation

- 6 tests unittest verts (TestPrepare ×2, TestAggregate ×3, TestWriteAnalysis ×1)
- 32 tests cumulés Vague 2 (autolink + skillify + eval) tous verts
- `forge skillify check skills/cross-modal-review` retourne `ok: true` (dogfooding)
- Le skill suit le pattern 6 phases avec validation Benjamin avant promotion à `compile-doctrine` si score < 6

## Non inclus dans P2

- **Auto-déclenchement par /documente** : à instruire séparément. La règle proposée (à valider) : déclencher cross-modal-review uniquement à la transition `tentative → stress_testing`, pas à chaque /documente.
- **SDK Claude Agent imbriqué pour vrais modèles distincts** : V1 utilise Task tool (le harness gère le dispatch). Si V2 nécessite un contrôle plus fin sur le modèle invoqué, passer par claude-agent-sdk imbriqué.
- **Métrique de retrieval P@k / R@k / MRR** : c'est P4 (Vague 3 séparée). Cross-modal eval mesure la qualité de la **synthèse**, pas la qualité du **retrieval**.

## Suite

**P4 (Vague 3)** : bench BM25 stdlib + corpus de test pour mesurer la qualité du retrieval (P@k, R@k, MRR, nDCG@k). Sera utilisé pour valider que `forge autolink graph-query` retrouve effectivement les bons subjects à profondeur 1-2.

Vague 2 close. Les 4 propositions structurelles de l'analyse FORGE-analyse 2026-05-09 sont implémentées (P5 + P3 + P2). Reste P4 (vague 3 standalone).
