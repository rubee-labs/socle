# P5 — Auto-link déterministe (typed graph)

## Contexte

L'analyse `/FORGE-analyse` du 9 mai 2026 sur le manifeste « Meta-Meta-Prompting » de Garry Tan (CEO Y Combinator) a identifié 5 primitives manquantes dans Forge par rapport à GBrain : auto-link déterministe, hybrid search benchmark, skillify, cross-modal eval, MCP server. Sur ces 5, l'auto-link était la plus immédiatement portable.

Le 10 mai, Benjamin a validé l'option 1 : enrichir le champ existant `typical_linked_types` plutôt que créer un nouveau champ (qui aurait fait doublon). L'objet de cette décision est l'implémentation Vague 1 de ce port.

## Décision

1. **Format YAML retenu** dans les `REFERENCE.md` des types : passage de liste plate `[supplier, product-line]` à liste de paires inline `[{name: ordered_from, type: supplier}, {name: contains, type: product-line}]`. Le parser reste rétrocompatible avec l'ancien format (fallback : `name == type`).
2. **Module Python autonome** `bin/autolink_engine.py` côté plugin claude-forge. Stdlib only, pattern aligné avec `forge_engine.py` (JSON out, exit code = `ok`).
3. **3 sous-commandes CLI** exposées via `forge autolink <cmd>` :
   - `extract <subject-path>` → liste des typed edges sortants du subject
   - `graph-query <slug> [--type X] [--direction in/out/both] [--depth N]` → BFS limité avec filtre par relation
   - `reconcile <subject-path>` → équivalent extract, idempotent par construction
4. **Pas de stockage du graph** — recalcul à la volée à chaque graph-query (lecture de tous les MEMORY.md du repo). Idempotent, pas de seconde source de vérité à maintenir, perf OK pour <100 subjects.
5. **Slug canonique** : `<type>:<name>` (ex: `supplier:weifang`). Format historique `<type>-<name>` toléré quand un type connu correspond au préfixe.
6. **Helpers extraits dans `forge_lib.py`** : `parse_inline_dict` (parse réel), `parse_typed_linked_types` (rétrocompatible), `parse_subject_slug` (résolution canonique + fallback).

## Validation

17 tests unitaires passent (TestParseInlineDict, TestParseTypedLinkedTypes, TestParseSubjectSlug, TestExtractCommand, TestGraphQueryCommand). Validation en conditions réelles sur 2 subjects existants de `claude-enterprise` :

- `extract` sur `services/achats/subjects/order-398` retourne correctement `ordered_from supplier:weifang`
- `graph-query supplier:homful --type ordered_from --direction incoming` retourne `supplier-order:order-383`

## Périmètre

- Modifie 4 REFERENCE.md sur 6 (les 2 autres : `backlog-tech` déprécié, `ce-architecture-decision` avec liste vide)
- Aucun MEMORY.md de subject existant n'est touché
- `linked_subjects` reste tel quel — pas de breaking change
- Le moteur `forge_engine.py` n'est pas modifié — ajout d'un module à côté

## Suite

Vague 2 (P2 cross-modal eval + P3 skillify) puis vague 3 (P4 métrique retrieval). Le MCP server (5e primitive identifiée) sort du scope de cette série de vagues — chantier séparé.
