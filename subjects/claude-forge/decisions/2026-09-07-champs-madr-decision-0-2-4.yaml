contexte: >
  Comparaison de /documente avec ADR, MADR, Decision Log et les commandes de fin de session
  (2026-09-07). /documente a une couche de synthèse que les autres n'ont pas, mais son corps
  de décision est libre : ni les alternatives écartées, ni la preuve d'application n'y sont
  garanties. MADR les rend obligatoires (« Considered Options », « Confirmation »).

options_considerees:
  - option: A — laisser le corps libre, documenter la bonne pratique dans le SKILL
    retenue: false
    raison: une règle en prose seule n'est pas appliquée (feedback « règle cash = code testé »)
  - option: B — refuser l'écriture d'une décision sans les deux champs
    retenue: false
    raison: casserait les skills appelants (/control-tower, /optimisation-campagne-*) qui écrivent des décisions courtes
  - option: C — écriture acceptée, avertissement structuré (`madr_missing`, `warnings`) affiché dans le récap
    retenue: true
    raison: le code porte la règle, la friction reste nulle pour les appels automatiques, le LLM complète dans la même invocation

decision: >
  Le corps YAML d'une décision porte à la racine `options_considerees` (liste option / retenue /
  raison) et `confirmation` (preuve + échéance). `write-capture --kind decision` retourne
  `madr_missing` et `warnings` si l'une manque. Modèle : `templates/decision.body.yaml`.

confirmation:
  preuve: tests/test_write_capture_madr.py (4 cas) verts ; les décisions écrites par /documente après le 2026-09-07 dans claude-enterprise portent les deux clés (grep -L sur decisions/ datées ≥ 2026-09-08 = vide)
  echeance: 2026-09-21
