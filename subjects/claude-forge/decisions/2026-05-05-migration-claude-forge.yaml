# Décision — Extraction Subject Pool vers plugin Claude Code claude-forge

## Position retenue

Subject Pool est extrait de claude-enterprise vers son propre repo Git autonome `rubee-labs/claude-forge`, distribué comme plugin Claude Code via `/plugin marketplace add`.

## Architecture finale

| Élément | Localisation |
|---|---|
| Code (engines, skills, slash, rules, templates, tests) | `rubee-labs/claude-forge` |
| Binaire CLI `forge` | Auto-installé dans PATH par Claude Code |
| Données projet (subjects/) | Repo consommateur (claude-enterprise etc.) |
| Méta-réflexion | `claude-forge/subjects/claude-forge/` (dogfooding) |
| Symlink local Benjamin | `claude-enterprise/harness/claude-forge` (gitignored) |

## Paramètres

- **repo_url** : https://github.com/rubee-labs/claude-forge
- **visibility** : private (Mode 2)
- **version** : 0.1.1
- **install_command** : `/plugin marketplace add rubee-labs/claude-forge` puis `/plugin install claude-forge@rubee-labs`
- **path_resolution_strategy** : cwd-based
- **distribution_model** : hybride (code global, données per-project)

## Justification

1. Subject Pool n'est pas spécifique Rubee — c'est une primitive de mémoire structurée (4ème couche)
2. Les clients potentiels existent — externalisable comme produit
3. Cohabitation possible avec claude-mem (axes différents)
4. Dogfooding via subjects/claude-forge/

## Conséquences pour les exécutants

- Slash commands qui invoquaient `/documente` → `/claude-forge:documente`
- Scripts qui invoquaient `python3 entreprise/config/feedback-loop/<engine>.py` → `forge documente|engine|scanner`
- Hook `~/.claude/scripts/init-healthcheck.sh` invoque `forge` (PATH) avec fallback clone local
- Hook `entreprise/scripts/log-documente-hook.py` log dans `entreprise/logs/documente_hook.log`

## Annulations doctrinales

- `feedback_pas_de_jargon_harness.md` (47 jours) archivé — "harness" désormais utilisé comme nom de slot architectural

## État

- Phase ouverte : déploiement client
- Validations OK : install local, install GitHub, fix release v0.1.1, scanner 15 actifs
- Validations restantes : test bout-en-bout sur subject Rubee, install premier client
