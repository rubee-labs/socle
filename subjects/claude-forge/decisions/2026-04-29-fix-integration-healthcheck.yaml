contexte: |
  Le scanner forge tournait en hook SessionStart séparé, sa sortie n'apparaissait pas dans
  le bloc Health-check unifié produit par ~/.claude/scripts/init-healthcheck.sh.
  Benjamin a noté l'absence de "Forge: OK" dans le bloc visible au démarrage.

decision: |
  Brancher forge_scanner.py dans init-healthcheck.sh comme les autres sous-scripts
  (knowledge-coordinator, feedback-log) au lieu d'un hook isolé.

actions_executees:
  - fichier: entreprise/config/feedback-loop/forge_scanner.py
    modif: retirer l'indentation initiale "  " des lignes de sortie (sera ajoutée par init-healthcheck.sh)

  - fichier: /Users/bhamon/.claude/scripts/init-healthcheck.sh  (hors repo)
    modif: nouvelle section "Forge Scanner" entre Knowledge Coordinator et Feedback
    bloc: |
      FORGE_SCRIPT="$PROJECT_DIR/entreprise/config/feedback-loop/forge_scanner.py"
      if [ -f "$FORGE_SCRIPT" ]; then
        FORGE_OUTPUT=$(python3 "$FORGE_SCRIPT" 2>&1 || echo "Forge: erreur script")
        RESULTS+=("$FORGE_OUTPUT")
        if echo "$FORGE_OUTPUT" | grep -q "alerte(s)"; then
          HAS_ISSUE=true
        fi
      fi

  - fichier: .claude/settings.json
    modif: retirer la commande SessionStart séparée pour forge_scanner.py
    raison: sinon double exécution (depuis init-healthcheck + depuis hook propre)

validation:
  test: "bash ~/.claude/scripts/init-healthcheck.sh"
  resultat: "Forge: OK (0 subjects, 0 alerte) apparaît dans le bloc unifié"

regle_apprise: |
  Tout nouveau scanner spécifique-CE qui doit apparaître dans le bloc Health-check
  doit être enregistré dans ~/.claude/scripts/init-healthcheck.sh, pas en hook isolé
  dans .claude/settings.json du repo CE. À documenter dans la doctrine subject-pool.

commit: 0b8efcc0
