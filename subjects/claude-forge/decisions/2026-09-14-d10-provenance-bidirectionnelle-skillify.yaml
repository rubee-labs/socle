contexte: >
  Analyse Forge-Lab #9 (WikiSkill, Google Research, arXiv 2608.27454) : chaque skill
  évolué porte un PURPOSE.md qui le mappe vers les patterns wiki qui l'ont motivé.
  Incident vécu pendant l'analyse même : les MEMORY (Lab + subject claude-forge,
  maj 2026-09-07) affirmaient « 0 skillify livré » — faux. Vérification git après
  correction de Benjamin : 4 skills réels produits par /skillify (annote 2026-06-23,
  compta-facture-suspens 2026-07-20, compta-valeur-en-transit 2026-07-27,
  compta-analyse-gcp 2026-08-07), tous sans provenance, tous absents des
  linked_skills des subjects. Le pool était aveugle à sa propre compilation —
  au point de croire la feature morte (sursis 2026-06-15 jamais tranché faute
  de visibilité). La limite « pas de pointeur inverse skill → subject » était
  connue depuis la refonte 2026-05-10 ; elle est désormais démontrée en pratique.

options_considerees:
  - option: A — Trancher d'abord le sursis /skillify, muter ensuite
    retenue: false
    raison: >
      Devenu sans objet : le sursis est de facto levé sur pièces (4 usages réels
      vérifiés git, dont 1 avant la review du 2026-07-15). Attendre n'apporte rien.
  - option: B — Doctrine seule (inscrire la règle, implémenter plus tard)
    retenue: false
    raison: >
      Une règle de provenance non outillée serait appliquée à la main ou pas du
      tout — exactement le mode de défaillance qui a produit l'incident.
  - option: C — Doctrine + moteur (D10 complet)
    retenue: true
    raison: >
      Le scaffold pose la traçabilité mécaniquement (zéro discipline requise),
      cohérent avec la doctrine déterministe Forge (autolink, skill-impact
      programmatique WikiSkill). Validé explicitement par Benjamin le 2026-09-14.

decision: >
  Tout skill compilé via /skillify déclare ses subjects d'origine
  (`source_subjects: [...]` dans le frontmatter du SKILL.md généré) et les
  subjects d'origine pointent vers lui (`linked_skills:` mis à jour par le
  scaffold) — provenance bidirectionnelle posée par `forge skillify scaffold
  --source-subjects`, jamais à la main.

parameters:
  version_plugin: 0.2.5
  cli: forge skillify scaffold --source-subjects "<path1>,<path2>"
  frontmatter_skill: "source_subjects: [<paths relatifs au repo>]"
  backlink: "linked_skills du MEMORY.md de chaque subject (inline, multiligne ou clé absente gérés)"
  check: "provenance_declared (11e check, hygiène non bloquante)"

consequences:
  - rules/subject-pool.md — ligne /skillify + champ linked_skills + règle de gestion 6 enrichis
  - bin/skillify_engine.py — _resolve_subject_memory + _update_subject_linked_skills + provenance dans la sortie scaffold
  - skills/skillify/SKILL.md v0.2 — Phase 1 (demander les subjects d'origine), Phase 2 (--source-subjects), Phase 4 (11 checks), gotcha incident, EVAL 6
  - tests/test_skillify.py — 12 tests verts (3 nouveaux : provenance+backlink, subject fantôme, multiligne)
  - Rétrofit des 4 skills existants (annote, compta-facture-suspens, compta-valeur-en-transit, compta-analyse-gcp) — optionnel, à faire côté CE
  - Le sursis 2026-06-15 est levé pour /skillify (4 usages réels) ; restent à trancher /cross-modal-review et le cycle γ

confirmation:
  preuve: >
    tests/test_skillify.py verts (12/12) ; au prochain /skillify réel, le SKILL.md
    généré contient source_subjects non vide ET le MEMORY.md du subject d'origine
    contient le skill dans linked_skills (visible dans le même commit).
  echeance: 2026-12-31
