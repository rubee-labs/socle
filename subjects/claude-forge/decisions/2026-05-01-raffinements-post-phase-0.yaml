contexte: |
  Session de raffinements naturels lors du démarrage de l'usage réel du subject pool
  (13 subjects créés : 7 supplier-orders + 6 suppliers). 4 ajustements consolidés.

decisions:
  - id: bilingue
    description: |
      Règle bilingue stricte. Squelette/taxonomie en anglais (champs frontmatter,
      forging_state, produced_by, horizon, noms de types, dossiers) ;
      contenu métier en langue de l'utilisateur (français pour Rubee) :
      analysis_dimensions, expected_events, narratif Quick/Détails.
    fichiers:
      - services/achats/types/supplier-order/REFERENCE.md (valeurs métier traduites)
      - services/achats/types/supplier-order/TEMPLATE.md (last_event.type traduit)
      - entreprise/config/rules/savoirs.md (table bilingue + justification)
      - entreprise/config/rules/skills-agents.md (exemple corrigé avec commentaires)
      - entreprise/skills/subject-create-type/SKILL.md (Phase 2 + Gotchas + EVAL 2bis)
    commits: [2ab4f1cf, 816226df]

  - id: module_dedie
    description: |
      Promouvoir la doctrine subject pool en module de premier rang. Le subject pool
      n'est pas un savoir parmi d'autres, c'est l'infrastructure de maturation centrale
      (réacteur). Lazy-chargé dans plus de contextes (skills/agents qui touchent à
      des subjects, /forge, /stress-test, /compile-doctrine).
    fichiers_crees:
      - entreprise/config/rules/subject-pool.md (~280 lignes)
    fichiers_modifies:
      - CLAUDE.md (nouvelle ligne dans le tableau des modules, terme "reacteur")
      - entreprise/config/rules/savoirs.md (section remplacée par référence courte)
      - entreprise/config/rules/skills-agents.md (idem)
    commit: c0ab479c

  - id: kpis_tier_1
    description: |
      Instrumenter le réacteur avec 5 KPIs Tier 1 :
      - Volume actif (subjects non archivés)
      - Distribution forging_state, par type, par domaine
      - Subjects en stagnation (>30j en seed/debating/tentative)
      - Artefacts compilés sur 30j
      - Taux de compilation (in_service / (in_service + doctrine non compilées))
    fichiers:
      - entreprise/config/feedback-loop/forge_scanner.py (compute_metrics + regenerate_metrics)
      - entreprise/SUBJECT-POOL-METRICS.md (nouveau, généré automatiquement)
      - bloc Health-check enrichi avec ligne agrégée
    commit: ced87bcd

  - id: fix_merger_permanents
    description: |
      Restreindre la détection merger_candidate aux subjects horizon: permanent.
      Évite les faux positifs en cascade sur les instances bornées qui partagent
      par construction leurs linked_subjects (toutes les commandes Simon).
    fichier: entreprise/config/feedback-loop/forge_scanner.py
    validation: 13 subjects (7 bounded + 6 permanent) → 2 faux positifs → 0 alerte
    commit: e2e626a2

regle_apprise: |
  Tout système de stockage de connaissance qui s'instrumente avec des règles de
  détection automatique (mergers, stagnations, contradictions) doit distinguer
  les subjects bornés (instances temporelles) des subjects permanents (entités
  qui s'enrichissent dans la durée). Sans cette distinction, les heuristiques
  conçues pour les permanents génèrent du bruit sur les bornés.

prochaines_actions:
  - Observer l'évolution des KPIs au fil de l'usage réel
  - Si volume justifie, ajouter Tier 2 (qualité du processus) puis Tier 3 (valeur créée)
  - Backlog : enrichir scanner pour détecter les liens orphelins (gotcha #4 toujours ouvert)
  - Brainstorm Tower-Control / super-agents par dossier (toujours en attente)

