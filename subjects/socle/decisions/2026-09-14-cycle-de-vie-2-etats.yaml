contexte: >
  Les clients de Benjamin ne comprennent pas la notion de « cycle γ ». Audit
  empirique du 2026-09-14 (git, pas les MEMORY) : en 4 mois depuis la refonte
  3 états du 2026-05-10, 6 changements d'état réels sur ~41 subjects, dont
  1 seul porteur de sens métier (order-383 → archived, clôture du 15/07) ;
  0 transition actif→mature — l'état `mature` n'existe dans aucun subject.
  80 % des subjects portent encore le vocabulaire aboli en mai (18 seed,
  12 tentative, 2 debating, 1 doctrine) : la migration « opportuniste en
  lecture » ne s'est pas faite, et /subject-create écrivait encore
  `forging_state: seed, conviction: 0` (skill jamais aligné sur la refonte
  de mai). Le sursis 2026-06-15 prévoyait exactement ce verdict : « si
  aucune transition actif→mature n'influence une décision réelle d'ici
  30 jours → réduire à archived: yes/no ».

options_considerees:
  - option: A — Garder 3 états, renommer seulement « cycle γ » en « cycle de vie »
    retenue: false
    raison: >
      Réglerait le problème de vocabulaire client mais conserverait un état
      `mature` à usage mesuré nul (0 transition en 4 mois) — du poids mort
      au regard du critère unique (efficacité Claude Code en entreprise).
  - option: B — Réduire à un booléen `archived: yes/no`
    retenue: false
    raison: >
      Équivalent sémantique mais casserait le champ `forging_state` partout
      (frontmatter, engine, scanner, graph, OKF viewers) pour zéro gain vs
      un enum à 2 valeurs. Migration coûteuse sans bénéfice.
  - option: C — 2 états `actif`/`archived` sur le champ existant + renommage + normalisation en écriture
    retenue: true
    raison: >
      Conserve le champ et la rétrocompat (mapping legacy), supprime le seul
      état mort, élimine le jargon γ des surfaces publiques, et corrige la
      cause racine de la non-migration (normalisation écrite par /documente,
      /subject-create créant `actif`). Validé par Benjamin le 2026-09-14.

decision: >
  Le cycle de vie d'un subject a 2 états — `actif` (vivant) / `archived`
  (clos) — transitions 100 % manuelles (clôture, réouverture rare).
  L'état `mature` est supprimé ; la maturité redevient un jugement à la
  demande (/cross-modal-review, /stress-test), pas un état. L'appellation
  « cycle γ » disparaît des surfaces publiques (doctrine, README, manifest,
  skills, légendes graph) au profit de « cycle de vie ». Tous les états
  legacy sont mappés en lecture vers actif/archived ET normalisés en
  écriture au prochain /documente. /subject-create initialise `actif`,
  n'écrit plus jamais `seed` ni `conviction`.

parameters:
  version_plugin: 0.3.0
  etats: [actif, archived]
  legacy_map_actif: [seed, debating, tentative, stress_testing, doctrine, in_service, under_review, mature]
  normalisation: en écriture au prochain /documente (plus de lecture seule)
  cross_modal_review: détaché de toute transition — outil qualité à la demande
  sursis_2026_06_15: >
    volet cycle γ clos par la présente décision ; volet /skillify clos le
    2026-09-14 matin (4 usages réels) ; volet /cross-modal-review toujours
    ouvert (1 usage recensé : order-395, 2026-05-19)

consequences:
  - bin/forge_engine.py + forge_scanner.py + graph_engine.py — LEGACY_STATE_MAP → 2 états, hints, métriques et légendes sans mature
  - bin/documente_engine.py — conviction retiré de list-subjects (nettoyage backlog)
  - rules/subject-pool.md — § Cycle de vie (2 états), transitions, mapping, exemples, règle 3, couche OKF
  - skills/documente v3.0 — description stale (« auto-applies γ transitions ») corrigée, Phase G = normalisation, EVAL 6 réécrit, hint cross-modal ré-ancré
  - skills/subject-create + subject-create-type — création en `actif` (fin de l'écriture de seed/conviction, cause racine des 18 seed)
  - skills/subject-merge — critères et exemples sans conviction ni états legacy
  - skills/cross-modal-review — détaché de compile-doctrine/in_service/conviction
  - README.md + plugin.json — γ retiré des surfaces publiques
  - tests/test_lifecycle.py — mapping verrouillé par test

confirmation:
  preuve: >
    tests/test_lifecycle.py verts ; au prochain /documente sur un subject
    legacy (ex: order-393 en debating), le frontmatter committé porte
    forging_state: actif ; SUBJECT-POOL-METRICS.md régénéré n'affiche plus
    que 2 états ; grep γ sur rules/ + README + skills ne rend plus que des
    mentions historiques datées.
  echeance: 2026-10-31
