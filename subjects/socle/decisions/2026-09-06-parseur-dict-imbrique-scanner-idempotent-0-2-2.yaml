# Décision

1. `parse_simple_yaml` lit les dicts imbriqués (`last_event:`, `last_synthesis:`). Avant : toute clé sans valeur inline devenait une liste, donc `last_event` valait `[]` sur 39/39 subjects CE ; le scanner retombait sur `created_at` et affichait 34 stagnants faux (16 réels), le knowledge-coordinator et la cascade étaient aveugles.
2. `forge scanner` ne réécrit `SUBJECTS-INDEX.md` / `SUBJECT-POOL-METRICS.md` que si leur contenu change hors ligne d'horodatage. Avant : réécriture à chaque SessionStart → 90 % des commits « Session » du repo CE ne contenaient que ces 2 fichiers, rafales de 6 commits en 3 minutes.
3. Tests d'intégration `test_documente_engine` (10 cas) conditionnés à `CLAUDE_FORGE_PROJECT_DIR` au lieu de `parents[4]` (héritage de l'époque où le plugin vivait dans CE) ; chemin du moteur corrigé (`bin/`). Suite : 84 passed, 10 skipped sans env.

# Contexte

Bloc 1 du plan « mémoire = re-synthèse bornée + hook post-bloc » validé par Benjamin le 2026-09-06 (décision CE `entreprise/config/decisions/2026-09-06-memoire-re-synthese-bornee-hook-post-bloc.yaml`). Blocs suivants : hook Stop `check-post-bloc.py` (CE), Phase L4 bornée de `/documente` (plugin), migration des 3 gros MEMORY.md d'entité.
