# Décision — Découplage CE via `.forge.yaml` (claude-forge 0.2.0)

## Contexte

claude-forge a été extrait de claude-enterprise (CE) mais codait en dur
l'arborescence de CE : écriture de l'index dans `entreprise/`, découverte des
subjects via le trio `("services","entreprise","humains")`. Conséquence : donné
à un client (ou à un repo perso), le plugin créait un dossier `entreprise/`
fantôme et cherchait les subjects au mauvais endroit. Révélé en bootstrapant le
**premier pool non-CE** : `jean-claude-code/subjects/kite-connect/` (réseau
Kite & Connect, inbound Hublack) — le scanner du cache a créé un
`jean-claude-code/entreprise/` parasite.

Benjamin (15 ans) : « Comment un plugin peut-il écrire dans un dossier précis ?
Si je le donne à un client, il ne doit pas écrire chez moi. Le plugin DOIT être
codé pour stocker dans un dossier propre à chaque repo. »

## Décision

Introduire un **seam de config par-repo** : un fichier `.forge.yaml` optionnel à
la racine du pool, lu par `load_forge_config()` (forge_lib.py), avec
auto-détection sûre quand il est absent. Les 6 sites couplés à CE sont recâblés
sur ce loader. Plus une **porte d'entrée client** : `forge init` (écrit le
`.forge.yaml` + scaffolde subjects/+types/) + skill guidé `/forge-init` + hook
SessionStart *nudge* qui suggère l'init au premier lancement (silencieux ensuite,
le `.forge.yaml` faisant marqueur).

## Garantie de non-régression CE

CE reste **strictement inchangé sans aucune config** : l'auto-détection trouve
`entreprise/` (qui existe) → même emplacement d'index, mêmes compteurs
(34 actifs / 15 stagnants), aucun `.forge.yaml` ajouté à CE. Le défaut `"."` dans
`pool_roots` est inerte pour CE (pas de `subjects/` à sa racine).

## Pourquoi pas un simple band-aid

Un fallback « entreprise/ sinon racine » réglait le symptôme (dossier fantôme)
mais laissait le plugin couplé en lecture (tuples CE). Le découplage complet via
config rend le plugin réellement distribuable — c'est la nature même d'un plugin
(cf. critique fondatrice de Benjamin).

## Distribution

Marketplace github `rubee-labs/claude-forge`. Le binaire actif est le cache
installé → un `/plugin update` est requis pour passer le cache en 0.2.0. En
attendant, le scan du pool JCC dans le health-check pointe explicitement sur le
binaire du clone dev (qui porte le fix), pour ne pas dépendre du timing de
release.
