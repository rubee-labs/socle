# Décision

1. Le MEMORY.md d'une entité (workflow folder) est une **synthèse bornée** : Quick < 100 mots, Doctrine en vigueur, Décisions actives ≤ 10 avec pointeurs, Décisions annulées, Règles apprises. Plafond 8 Ko (`memory_max_kb` en frontmatter). Aucune section journal (`## État` daté) : un run écrit `rapports/YYYY-MM-DD-<slug>.md`.
2. Deux commandes moteur déterministes : `check-memory <path>` (taille, plafond, sections, lignes de journal, décisions actives, derniere_maj) et `patch-section <path> --section "## X" --body-file f [--touch-derniere-maj] [--expected-hash h]` (remplace ou crée le corps d'une seule section, reste conservé octet pour octet, idempotent). La Phase F4 rédige les sections en LLM (quelques centaines de tokens) et écrit en Python, au lieu d'un Edit libre en append.
3. Évacuation d'un journal existant = proposition à l'utilisateur, validation explicite avant tout retrait de contenu (relecture + `/cross-modal-review` recommandé au-delà de 30 Ko).
4. `/documente` passe de `effort: low` à `effort: medium` : la seule part LLM (capture + synthèse) porte toute la qualité ; sur Fable 5.1, medium ≈ Fable 5 high.

# Motif

Audit CE 2026-09-06 : MEMORY.md d'entité en append (factures 33 → 187 Ko en 7 semaines, 318 lignes de journal de runs, incident doublons 2026-08-06 avec MEMORY non relu), alors que les MEMORY.md du subject pool re-synthétisés par /documente restent bornés. Bloc 3 du plan validé par Benjamin (décision CE `2026-09-06-memoire-re-synthese-bornee-hook-post-bloc.yaml`) ; bloc 2 = hook Stop `check-post-bloc.py` côté CE.
